# Spring Boot Server Configuration
server.port=8080

# Database Configuration - SQLite
# date_string_format tells the xerial driver our DATE columns are plain "yyyy-MM-dd"
# text, avoiding its default timestamp parser choking on date-only values
# (see repo memory: SQLite JDBC "Error parsing time stamp")
spring.datasource.url=jdbc:sqlite:salary_system.db?date_string_format=yyyy-MM-dd
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA/Hibernate Configuration
# schema.sql owns the production schema; Hibernate must not also try to alter it
# (our minimal SQLiteDialect doesn't implement ADD COLUMN, which ddl-auto=update requires)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=com.salary.config.SQLiteDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging
logging.level.root=INFO
logging.level.com.salary=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Application Info
spring.application.name=salary-management-system
app.version=1.0.0
