<div class="page">
  <mat-card>
    <h2>New Employee</h2>
    <form [formGroup]="form" (ngSubmit)="submit()" class="employee-form">
      <mat-form-field appearance="outline">
        <mat-label>Employee ID</mat-label>
        <input matInput formControlName="employeeId">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>First Name</mat-label>
        <input matInput formControlName="firstName">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Last Name</mat-label>
        <input matInput formControlName="lastName">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Phone Number</mat-label>
        <input matInput formControlName="phoneNumber">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Department</mat-label>
        <input matInput formControlName="department">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Designation</mat-label>
        <input matInput formControlName="designation">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Country Name</mat-label>
        <input matInput formControlName="countryName">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Hired Date</mat-label>
        <input matInput type="date" formControlName="hiredDate">
      </mat-form-field>

      <div class="actions">
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || submitting">Save</button>
        <button mat-button type="button" (click)="cancel()">Cancel</button>
      </div>
      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>
  </mat-card>
</div>
